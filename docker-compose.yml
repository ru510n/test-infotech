services:
  mysql:
    container_name: infotechtest-mysql
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped

  php:
    container_name: infotechtest-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        LOCAL_IP: ${LOCAL_IP:-host.docker.internal}
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    networks:
      - app-network
    depends_on:
      - mysql
    restart: unless-stopped

  nginx:
    container_name: infotechtest-nginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    networks:
      - app-network
    depends_on:
      - php
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
